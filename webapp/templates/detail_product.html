{% extends 'base.html' %}

{% block title %}
    <title>Details</title>
{% endblock %}

{% block content %}
<div class="card mt-3" style="">
  <div class="row g-0">
    <div class="col-md-4">
      <img src="{{ product.image  }}" class="img-fluid rounded-start" alt="...">
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <h5 class="card-title">{{ product.title }}</h5>
        <p class="card-text">{{ product.description }}</p>
          <p class="card-text">{{ product.category.title }}</p>
          <p class="card-text">{{ product.price }} $</p>
          <p class="card-text">Остаток: {{ product.rest }}</p>
        <p class="card-text"><small class="text-body-secondary">Added: {{ product.created_at }}</small></p>
          <a href="{% url 'update_product' product.pk %}" class="card-link" style="text-decoration: none; padding-left: 5px">Редактировать</a>

      </div>
    </div>
  </div>
</div>

{% endblock %}
