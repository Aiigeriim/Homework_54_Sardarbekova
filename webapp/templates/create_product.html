{% extends 'base.html' %}

{% block title %}
   <title>New position</title>
{% endblock %}

{% block content %}

    <div class="mt-3">
<h1>Создать позицию</h1>
<form action="{% url 'add_product' %}" method="post">
    {% csrf_token %}

    <input type="text" name="title" placeholder="Название" required/>
    <br/>
    <br/>
    <input type="number" id="numberInput" name="price" placeholder="Цена" required>
    <br/>
    <br/>
    <input type="url" id="imageUrl" name="image" placeholder="https://example.com/image.jpg" required>
    <br/>
    <br/>
    <select name="category_id">
        {% for category in categories %}
        <option placeholder="Категория" value="{{ category.id }}">{{ category.title }}</option>
        {% endfor %}
    </select>
    <br/>
    <br/>
    <label>Описание:</label><br/>
    <textarea name="description" rows="3" style="width: 50%; resize: vertical;" placeholder="Описание"></textarea>
    <br/>
    <br/>
    <input type="submit" class="btn btn-success" value="Добавить позицию"/>
</form>
</div>


{% endblock %}
