{% extends 'base.html' %}

{% block title %}
    <title>Positions</title>
{% endblock %}

{% block content %}
    <div class="row mt-3">
    {%  for product in products  %}
        <div class="col-12 col-md-4 col-lg-3 mb-3">
        <div class="card">
        <img style="height: 300px" src="{{ product.image }}" class="card-img-top" alt="...">
        <div class="card-body">
            <h5 class="card-title">{{ product.title  }}</h5>
            <ul class="list-group list-group-flush">
            <li class="list-group-item">{{ product.category.title }}</li>
            <li class="list-group-item">{{ product.price }} $</li>
                <a href="{% url 'product_detail' product.pk %}" class="card-link" style="text-decoration: none; padding-left: 5px">Детали</a>
        </ul>
    </div>
</div>
        </div>
        {% empty %}
        <p>Пусто</p>
    {% endfor %}
    </div>
{% endblock %}
