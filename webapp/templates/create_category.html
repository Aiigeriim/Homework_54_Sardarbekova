{% extends 'base.html' %}

{% block title %}
    <title>New category</title>
{% endblock %}

{% block content %}

       <div class="mt-3">
<h1>Создать категорию</h1>
<form action="{% url 'add_category' %}" method="post">
    {% csrf_token %}

    <input type="text" name="title" placeholder="Название" required/>
    <br/>
    <br/>
    <textarea name="description" rows="3" style="width: 50%; resize: vertical;" placeholder="Описание"></textarea>
    <br/>
    <br/>
    <input type="submit" class="btn btn-success" value="Добавит категорию"/>
</form>
</div>

{% endblock %}
