{% extends 'base.html' %}

{% block content %}

    <form action="" method="post">
        {% csrf_token %}
        <p>Вы действительно хотите удалить позицию {{ product.title }}?</p>
        <a class="btn btn-success" href="{% url 'product_detail' product.pk %}">Отмена</a>
        <button class="btn btn-danger" href="{% url 'index' %}"  type="submit">Удалить</button>
    </form>
{% endblock %}
